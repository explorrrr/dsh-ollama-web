# Example: install the package, then use the settings card for provider
# selection or pin both provider fields here.
- insert:
    - id: ollama-web
      name: dsh-ollama-web
      config:
        baseURL: https://ollama.com
        apiKeyEnv: OLLAMA_API_KEY
        maxResults: 5
        snippetMax: 2000
        searchTimeoutMs: 30000
        maxResponseBytes: 2097152
        fetchPath: /api/web_fetch
        fetchTimeoutMs: 30000
        fetchMaxChars: 100000
        # When set, keep web.fetchProvider: ollama pinned below as well.
        # The settings card writes both values together.
        enableFetchProvider: false

# A web entry replaces the whole row config, so pin both fields. The settings
# card writes this selection instead when web provider settings are available.
- id: web
  config:
    searchProvider: ollama
    # Keep http for the credential-free DSH fetch provider (default), or change
    # to ollama and set enableFetchProvider: true above.
    fetchProvider: http

# Only if the built-in DeepSeek search provider is mounted.
- id: web-search-deepseek
  disabled: true
