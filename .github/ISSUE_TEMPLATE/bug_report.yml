name: Bug report
description: Report a reproducible problem with dsh-ollama-web
labels: [bug]
body:
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      placeholder: 0.2.1-rc.2
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Node version
      placeholder: macOS 15, Node 22.23.2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Redact API keys and private queries.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and error code
      description: Include WEB_PROVIDER_* codes when present.
    validations:
      required: true
