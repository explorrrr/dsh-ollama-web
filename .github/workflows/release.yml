name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Verify the release tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          TAG_COMMIT=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          test "$TAG_COMMIT" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main
      - name: Verify repository metadata
        run: |
          if ! grep -q 'github.com/explorrrr/dsh-ollama-web' packages/host/package.json; then
            echo "Repository metadata must point to github.com/explorrrr/dsh-ollama-web." >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm check
      - run: pnpm audit --prod
      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/host/package.json').version")
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - name: Stage publish directory
        run: |
          set -euo pipefail
          mkdir -p package-artifacts
          tar --exclude=node_modules --exclude='*.tgz' -czf package-artifacts/dsh-ollama-web-package.tgz -C packages/host .
          (cd package-artifacts && shasum -a 512 ./*.tgz > SHA512SUMS)
          cat package-artifacts/SHA512SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages
          path: package-artifacts/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify npm supports trusted publishing
        run: |
          set -euo pipefail
          npm --version
          NPM_VERSION=$(npm --version)
          node -e 'const [major, minor] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && minor < 5)) { console.error("npm 11.5+ is required"); process.exit(1); }' "$NPM_VERSION"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: release-artifacts
      - name: Verify and extract publish artifact
        run: |
          set -euo pipefail
          (cd release-artifacts && shasum -a 512 -c SHA512SUMS)
          mkdir -p stage/package
          tar -xzf release-artifacts/dsh-ollama-web-package.tgz -C stage/package
          VERSION=$(node -p "require('./stage/package/package.json').version")
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test "$(node -p "require('./stage/package/package.json').name")" = "dsh-ollama-web"
      - name: Publish package
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./stage/package/package.json').version")
          if npm view "dsh-ollama-web@$VERSION" version >/dev/null 2>&1; then
            echo "dsh-ollama-web@$VERSION already exists; skipping."
          else
            if [[ "$VERSION" == *-* ]]; then DIST_TAG=next; else DIST_TAG=latest; fi
            npm publish ./stage/package --provenance --access public --tag "$DIST_TAG" --ignore-scripts
          fi
      - name: Download published npm tarball
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./stage/package/package.json').version")
          mkdir -p dist
          fetch_tarball() {
            local pkg="$1"
            local out="$2"
            local url=""
            for attempt in $(seq 1 24); do
              if url=$(npm view "$pkg@$VERSION" dist.tarball 2>/dev/null) && [ -n "$url" ]; then
                if curl -fsSL "$url" -o "$out"; then
                  return 0
                fi
              fi
              echo "Waiting for $pkg@$VERSION on the registry (attempt $attempt/24)..."
              sleep 5
            done
            echo "Could not download $pkg@$VERSION" >&2
            return 1
          }
          fetch_tarball dsh-ollama-web "dist/dsh-ollama-web-$VERSION.tgz"
          (cd dist && shasum -a 512 ./*.tgz > SHA512SUMS)
          cat dist/SHA512SUMS
      - name: Verify release asset contains both halves
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./stage/package/package.json').version")
          HOST_LIST=$(mktemp)
          CLIENT_JS=$(mktemp)
          trap 'rm -f "$HOST_LIST" "$CLIENT_JS"' EXIT
          tar -tzf "dist/dsh-ollama-web-$VERSION.tgz" > "$HOST_LIST"
          grep -qx 'package/dist/update/service.js' "$HOST_LIST"
          grep -qx 'package/dist/update/install.js' "$HOST_LIST"
          grep -qx 'package/client.js' "$HOST_LIST"
          tar -xOzf "dist/dsh-ollama-web-$VERSION.tgz" package/client.js > "$CLIENT_JS"
          grep -q 'ollama-web-update' "$CLIENT_JS"
          grep -q 'plugins.detail.section' "$CLIENT_JS"
          grep -q "id: 'dsh-ollama-web'" "$CLIENT_JS"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./stage/package/package.json').version")
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then PRERELEASE="--prerelease"; fi
          node scripts/release-notes.mjs "$VERSION" > release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" $PRERELEASE --notes-file release-notes.md
          fi
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tgz dist/SHA512SUMS --clobber
