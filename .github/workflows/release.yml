name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - name: Ensure npm supports trusted publishing
        run: |
          npm install --global npm@11 --silent
          npm --version
      - name: Verify repository metadata
        run: |
          if ! grep -q 'github.com/explorrrr/dsh-ollama-web' packages/host/package.json packages/client/package.json; then
            echo "Repository metadata must point to github.com/explorrrr/dsh-ollama-web." >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm check
      - name: Publish host package
        working-directory: packages/host
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-ollama-web@$VERSION" version >/dev/null 2>&1; then
            echo "dsh-ollama-web@$VERSION already exists; skipping."
          else
            npm publish --provenance --access public
          fi
      - name: Publish client package
        working-directory: packages/client
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-ollama-web-client@$VERSION" version >/dev/null 2>&1; then
            echo "dsh-ollama-web-client@$VERSION already exists; skipping."
          else
            npm publish --provenance --access public
          fi
      - name: Pack release artifacts
        run: |
          mkdir -p dist
          (cd packages/host && npm pack --pack-destination ../../dist)
          (cd packages/client && npm pack --pack-destination ../../dist)
          (cd dist && shasum -a 512 ./*.tgz > SHA512SUMS)
          cat dist/SHA512SUMS
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tgz dist/SHA512SUMS --clobber
