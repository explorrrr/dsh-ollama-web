name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports trusted publishing
        run: |
          npm install --global npm@11 --silent
          npm --version
      - name: Verify repository metadata
        run: |
          if ! grep -q 'github.com/explorrrr/dsh-ollama-web' packages/host/package.json packages/client/package.json; then
            echo "Repository metadata must point to github.com/explorrrr/dsh-ollama-web." >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm check
      - name: Publish host package
        working-directory: packages/host
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-ollama-web@$VERSION" version >/dev/null 2>&1; then
            echo "dsh-ollama-web@$VERSION already exists; skipping."
          else
            npm publish --provenance --access public
          fi
      - name: Publish client package
        working-directory: packages/client
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-ollama-web-client@$VERSION" version >/dev/null 2>&1; then
            echo "dsh-ollama-web-client@$VERSION already exists; skipping."
          else
            npm publish --provenance --access public
          fi
      - name: Download published npm tarballs
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/host/package.json').version")
          CLIENT_VERSION=$(node -p "require('./packages/client/package.json').version")
          test "$VERSION" = "$CLIENT_VERSION"
          mkdir -p dist
          fetch_tarball() {
            local pkg="$1"
            local out="$2"
            local url=""
            for attempt in $(seq 1 24); do
              if url=$(npm view "$pkg@$VERSION" dist.tarball 2>/dev/null) && [ -n "$url" ]; then
                if curl -fsSL "$url" -o "$out"; then
                  return 0
                fi
              fi
              echo "Waiting for $pkg@$VERSION on the registry (attempt $attempt/24)..."
              sleep 5
            done
            echo "Could not download $pkg@$VERSION" >&2
            return 1
          }
          fetch_tarball dsh-ollama-web "dist/dsh-ollama-web-$VERSION.tgz"
          fetch_tarball dsh-ollama-web-client "dist/dsh-ollama-web-client-$VERSION.tgz"
          (cd dist && shasum -a 512 ./*.tgz > SHA512SUMS)
          cat dist/SHA512SUMS
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tgz dist/SHA512SUMS --clobber
